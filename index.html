<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>偽りの聖堂 - False Sanctuary</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #09090d;
    --panel-bg: rgba(18, 18, 26, 0.94);
    --gold: #c5a663;
    --gold-dim: #6e5c36;
    --crimson: #b01e38;
    --purple: #6f2da8;
    --ice: #8bb8c4;
    --amber: #d9822b;
    --text-main: #eae8e3;
    --text-muted: #8e8b84;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #050508;
    color: var(--text-main);
    font-family: 'Shippori Mincho', serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game-container {
    width: 100%;
    max-width: 960px;
    min-height: 100dvh;
    border-left: 1px solid var(--gold-dim);
    border-right: 1px solid var(--gold-dim);
    background: radial-gradient(circle at 50% 20%, #1d1926 0%, #09090d 75%);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
  }

  /* 1. ヘッダー */
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #0d0d14;
    border-bottom: 1px solid var(--gold-dim);
    gap: 8px;
    z-index: 5;
  }

  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    font-size: 0.88rem;
  }

  .stat-item span {
    color: var(--gold);
    font-weight: 800;
    font-size: 1.05rem;
  }

  .police-gauge-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bar-bg {
    width: 85px;
    height: 9px;
    background: #1f1f29;
    border: 1px solid #444;
    overflow: hidden;
    border-radius: 2px;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.4s ease, background-color 0.4s ease;
  }

  #police-fill { background: var(--crimson); width: 0%; }
  .danger-pulse { animation: pulseRed 1.2s infinite; }

  @keyframes pulseRed {
    0%, 100% { box-shadow: 0 0 4px var(--crimson); }
    50% { box-shadow: 0 0 14px #ff2a55; }
  }

  .save-indicator {
    font-size: 0.72rem;
    color: var(--text-muted);
    border: 1px solid #2a2a36;
    padding: 2px 6px;
    border-radius: 3px;
    background: #13131c;
    transition: color 0.3s, border-color 0.3s;
  }
  .save-indicator.saved {
    color: var(--ice);
    border-color: #3d5a63;
  }

  .menu-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  button.nav-btn {
    background: #171722;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 5px 10px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
    border-radius: 3px;
  }

  button.nav-btn:hover, button.nav-btn:active {
    background: var(--gold-dim);
    color: #fff;
  }

  button.nav-btn.sacrifice-ready {
    border-color: var(--crimson);
    color: #ff6b81;
    animation: pulseRed 1.5s infinite;
  }

  /* 2. ニュースティッカー */
  .ticker {
    background: #131118;
    border-bottom: 1px solid #292533;
    padding: 6px 14px;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .ticker span {
    color: var(--gold);
    font-weight: 600;
    margin-right: 6px;
  }

  /* 3. メインステージ（聖堂） */
  main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 14px;
    gap: 12px;
    background-image: 
      radial-gradient(ellipse at top, rgba(197, 166, 99, 0.08), transparent 65%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 50px);
  }

  .stage-top {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
    z-index: 2;
  }

  /* 相談者ステータス */
  .target-card {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dim);
    padding: 10px 12px;
    flex: 1;
    max-width: 330px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    border-radius: 4px;
  }

  .target-header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
    gap: 6px;
  }

  .target-title {
    font-size: 0.96rem;
    font-weight: 800;
    color: var(--gold);
  }

  .turn-badge {
    font-size: 0.78rem;
    background: #231f2e;
    border: 1px solid var(--gold-dim);
    padding: 2px 6px;
    border-radius: 3px;
    color: #f0e6d2;
    white-space: nowrap;
  }
  .turn-badge.urgent {
    border-color: var(--crimson);
    color: #ff6b81;
    animation: pulseRed 1.2s infinite;
  }

  .gauge-row {
    margin-bottom: 7px;
    font-size: 0.82rem;
  }

  .gauge-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }

  .gauge-row .bar-bg { width: 100%; height: 8px; }
  #caution-fill { background: var(--amber); }
  #fanatic-fill { background: linear-gradient(90deg, var(--purple), var(--crimson)); }

  .caution-status-tag {
    font-size: 0.74rem;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 4px;
  }

  .weakness-box {
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px dashed #333;
    font-size: 0.82rem;
    color: #ccc;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .weakness-val { color: #ff8fa3; font-weight: 600; }

  /* 相談者シルエット演出 */
  .silhouette-area {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
  }

  .person-silhouette {
    width: 140px;
    height: 200px;
    background: radial-gradient(circle at 50% 25%, #16161f 26px, transparent 28px),
                radial-gradient(ellipse at 50% 85%, #12121a 60px, transparent 62px);
    position: relative;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.95));
  }

  .eyes {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
  }

  .eye {
    width: 6px;
    height: 3px;
    background: var(--ice);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--ice);
    transition: 0.5s;
  }

  .eye.caution-high {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    height: 2px;
    width: 8px;
  }

  .eye.fanatic-mid {
    background: #d980fa;
    box-shadow: 0 0 10px #d980fa;
    transform: scale(1.3);
  }

  .eye.fanatic-high {
    background: #ff2a55;
    box-shadow: 0 0 16px #ff2a55;
    transform: scale(1.8);
  }

  /* 常識ロック一覧 */
  .locks-card {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dim);
    padding: 10px 12px;
    flex: 1;
    max-width: 300px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    border-radius: 4px;
  }

  .locks-header {
    font-size: 0.85rem;
    color: var(--gold);
    margin-bottom: 6px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
  }

  .lock-item {
    font-size: 0.82rem;
    padding: 5px 7px;
    margin-bottom: 5px;
    background: #14141c;
    border-left: 3px solid var(--ice);
    transition: 0.3s;
    border-radius: 2px;
  }

  .lock-item.broken {
    border-left-color: var(--crimson);
    background: rgba(176, 30, 56, 0.18);
    color: #ff758f;
    text-decoration: line-through;
  }

  /* セリフウィンドウ */
  .dialogue-box {
    background: rgba(11, 11, 17, 0.96);
    border: 1px solid var(--gold);
    padding: 12px 16px;
    min-height: 125px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.85);
    border-radius: 4px;
  }

  .speaker-name {
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 800;
    margin-bottom: 5px;
  }

  .dialogue-text {
    font-size: 0.96rem;
    line-height: 1.55;
    color: #f2f0eb;
  }

  .system-log {
    font-size: 0.82rem;
    color: #c4bfb4;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #242430;
    line-height: 1.45;
  }

  /* 4. アクションエリア */
  .action-area {
    background: #0c0c12;
    border-top: 1px solid var(--gold-dim);
    padding: 10px 14px 16px;
    z-index: 3;
  }

  .sub-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .sub-btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .observe-btn {
    background: #181c29;
    color: var(--ice);
    border: 1px solid #4a6b75;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.2s;
    border-radius: 3px;
  }

  .observe-btn.risky {
    border-color: var(--amber);
    color: #f3b36b;
  }

  .observe-btn:hover:not(:disabled) {
    background: #253042;
    color: #fff;
  }

  .forbidden-btn {
    background: #241326;
    color: #e082ff;
    border: 1px solid #7c3896;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.2s;
    border-radius: 3px;
  }

  .forbidden-btn:hover:not(:disabled) {
    background: #3d1d42;
    color: #fff;
  }

  .forbidden-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .hint-guide {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .command-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .cmd-card {
    background: #15151e;
    border: 1px solid #3d3524;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--text-main);
    transition: 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-radius: 4px;
  }

  .cmd-card:hover:not(:disabled), .cmd-card:active:not(:disabled) {
    border-color: var(--gold);
    background: #22202d;
  }

  .cmd-card:disabled, .observe-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .cmd-header-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cmd-tag {
    font-size: 0.78rem;
    color: var(--gold);
    font-weight: 800;
  }

  .cmd-preview {
    font-size: 0.85rem;
    color: #e0ddd7;
    line-height: 1.38;
  }

  /* モーダルウィンドウ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 20;
    padding: 14px;
  }

  .modal-box {
    background: #12121a;
    border: 1px solid var(--gold);
    width: 100%;
    max-width: 640px;
    max-height: 88dvh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    border-radius: 4px;
  }

  .modal-title {
    font-size: 1.1rem;
    color: var(--gold);
    border-bottom: 1px solid var(--gold-dim);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 0 6px;
  }

  .guide-section {
    background: #171722;
    border: 1px solid #2b2b38;
    padding: 10px 12px;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .guide-sec-title {
    font-size: 0.94rem;
    font-weight: 800;
    border-bottom: 1px dashed #333;
    padding-bottom: 4px;
  }

  .role-slot {
    border: 1px solid #333;
    padding: 10px;
    background: #181822;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-radius: 3px;
  }

  .role-slot-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  select.role-select {
    background: #0f0f15;
    color: var(--text-main);
    border: 1px solid var(--gold-dim);
    padding: 6px;
    font-family: inherit;
    font-size: 0.85rem;
    width: 100%;
    border-radius: 3px;
  }

  .follower-list-item {
    border: 1px solid #2c2c3a;
    padding: 10px;
    background: #16161f;
    font-size: 0.85rem;
    line-height: 1.5;
    border-radius: 3px;
  }

  .event-choice-btn {
    background: #191924;
    border: 1px solid var(--gold-dim);
    color: var(--text-main);
    padding: 12px;
    text-align: left;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    line-height: 1.45;
    border-radius: 3px;
  }
  .event-choice-btn:hover {
    border-color: var(--gold);
    background: #252333;
  }

  .primary-btn {
    background: var(--gold-dim);
    color: #fff;
    border: 1px solid var(--gold);
    padding: 10px 20px;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    align-self: center;
    margin-top: 6px;
    border-radius: 3px;
  }
  .primary-btn:hover { background: var(--gold); color: #000; }

  /* === スマホ縦画面（レスポンシブ）対応 === */
  @media (max-width: 680px) {
    header {
      padding: 8px 10px;
    }
    .stats-bar {
      gap: 8px;
      font-size: 0.82rem;
    }
    .bar-bg {
      width: 60px;
    }
    .menu-buttons {
      width: 100%;
      justify-content: space-between;
    }
    button.nav-btn {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      font-size: 0.76rem;
    }
    .stage-top {
      flex-direction: column;
      gap: 8px;
    }
    .target-card, .locks-card {
      max-width: 100%;
      width: 100%;
      padding: 8px 10px;
    }
    .locks-card {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .locks-header {
      width: 100%;
      margin-bottom: 2px;
      font-size: 0.8rem;
    }
    .lock-item {
      margin-bottom: 0;
      font-size: 0.78rem;
      padding: 4px 6px;
    }
    .silhouette-area {
      top: 52%;
      opacity: 0.35;
    }
    .dialogue-box {
      padding: 10px 12px;
      min-height: 115px;
    }
    .dialogue-text {
      font-size: 0.9rem;
    }
    .command-grid {
      grid-template-columns: 1fr;
      gap: 7px;
    }
    .cmd-card {
      padding: 9px 11px;
    }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- 1. ヘッダー -->
  <header>
    <div class="stats-bar">
      <div class="stat-item"><span id="day-num">1</span>日目</div>
      <div class="stat-item">狂信者:<span id="fanatic-count">0</span>人</div>
      <div class="police-gauge-wrap">
        <div>捜査:<strong id="police-text">0%</strong></div>
        <div class="bar-bg" id="police-bar-box"><div class="bar-fill" id="police-fill"></div></div>
      </div>
      <div class="save-indicator" id="save-indicator">記録済</div>
    </div>
    <div class="menu-buttons">
      <button class="nav-btn" onclick="openModal('roles')">聖堂の役職</button>
      <button class="nav-btn" onclick="openModal('archive')">狂信者名簿</button>
      <button class="nav-btn" id="sacrifice-btn" onclick="openModal('sacrifice')">身代わり</button>
      <button class="nav-btn" onclick="openModal('retire')">教団の決断</button>
      <button class="nav-btn" onclick="openModal('guide')">心理戦の掟</button>
    </div>
  </header>

  <!-- 2. ニュースティッカー -->
  <div class="ticker">
    <span>📰 世間の噂</span><em id="news-text">【匿名掲示板】「駅前の古い聖堂、最近やたら人が出入りしてるけど何の宗教？」</em>
  </div>

  <!-- 3. メインステージ -->
  <main>
    <div class="stage-top">
      <!-- 左：相談者ステータス -->
      <div class="target-card">
        <div class="target-header-row">
          <div class="target-title" id="target-job">疲弊した中堅会社員</div>
          <div class="turn-badge" id="turn-badge">残り 6 ターン</div>
        </div>
        <div class="gauge-row">
          <div class="gauge-label">
            <span>警戒心 <span id="caution-state" class="caution-status-tag"></span></span>
            <span id="caution-val">75%</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="caution-fill" style="width: 75%;"></div></div>
        </div>
        <div class="gauge-row">
          <div class="gauge-label"><span>狂信度</span><span id="fanatic-val">0%</span></div>
          <div class="bar-bg"><div class="bar-fill" id="fanatic-fill" style="width: 0%;"></div></div>
        </div>
        <div class="weakness-box">
          <span>隠された弱点: <span class="weakness-val" id="target-weakness">？？？</span></span>
        </div>
      </div>

      <!-- 右：常識ロック -->
      <div class="locks-card">
        <div class="locks-header">守っている常識（すべて破壊で狂信化）</div>
        <div id="locks-container" style="display:flex; flex-direction:column; gap:4px; width:100%;"></div>
      </div>
    </div>

    <!-- 中央シルエット -->
    <div class="silhouette-area">
      <div class="person-silhouette">
        <div class="eyes">
          <div class="eye" id="eye-l"></div>
          <div class="eye" id="eye-r"></div>
        </div>
      </div>
    </div>

    <!-- 下：セリフウィンドウ -->
    <div class="dialogue-box">
      <div>
        <div class="speaker-name" id="speaker-name">相談者</div>
        <div class="dialogue-text" id="dialogue-text">「……お願いします、誰かに話を聞いてほしくてここに来ました」</div>
      </div>
      <div class="system-log" id="system-log">相手の警戒心が高い間は【沈黙】も過激な言葉も逆効果になります。まずは言動から傾向を推理しましょう。</div>
    </div>
  </main>

  <!-- 4. アクションエリア -->
  <div class="action-area" id="action-area">
    <div class="sub-actions">
      <div class="sub-btn-group">
        <button class="observe-btn" id="observe-btn" onclick="doObserve()">👁️ 沈黙（観察）</button>
        <button class="forbidden-btn" id="forbidden-btn" onclick="openModal('forbidden')">📖 禁断の教義 (<span id="forbidden-count">0</span>/8)</button>
      </div>
      <div class="hint-guide" id="role-bonus-info">役職: なし</div>
    </div>
    <div class="command-grid" id="command-grid"></div>
  </div>

  <!-- モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-content"></div>
  </div>
</div>

<script>
// ==========================================
// 0. セーブデータ管理定数
// ==========================================
const STORAGE_KEY = "false_sanctuary_save_v1";
let modalClosableByBackdrop = true;

// ==========================================
// 1. 全マスターデータ（プロファイリング重み付け対応）
// ==========================================

let state = {
  day: 1,
  police: 0,
  followers: [],
  roles: { sakura: null, guard: null, watcher: null },
  unlockedForbidden: [],
  sacrificeCount: 0,
  target: null,
  waitingNext: false,
  nextButtonLabel: "",
  forbiddenUsedThisTurn: false,
  observedThisTurn: false,
  pendingEventIdx: null,
  currentCommands: [],
  uiSnapshot: {
    news: "",
    speaker: "",
    dialogue: "",
    log: ""
  }
};

function saveGame() {
  try {
    state.uiSnapshot = {
      news: document.getElementById("news-text").textContent,
      speaker: document.getElementById("speaker-name").textContent,
      dialogue: document.getElementById("dialogue-text").textContent,
      log: document.getElementById("system-log").textContent
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const ind = document.getElementById("save-indicator");
    if (ind) {
      ind.textContent = "自動保存済";
      ind.classList.add("saved");
      setTimeout(() => ind.classList.remove("saved"), 900);
    }
  } catch (e) {
    console.warn("Save failed:", e);
  }
}

function clearSaveData() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    console.warn("Clear save failed:", e);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const loaded = JSON.parse(raw);
    if (!loaded || !loaded.target || !loaded.target.weakness || !Array.isArray(loaded.target.locks)) {
      return false;
    }

    // マスターデータから関数や最新定義を再バインド（JSON化で失われる要素の補完）
    const freshWeak = WEAKNESSES_DATA.find(w => w.id === loaded.target.weakness.id);
    if (freshWeak) loaded.target.weakness = freshWeak;

    loaded.target.locks = loaded.target.locks.map(l => {
      const freshLock = LOCKS_DATA.find(x => x.id === l.id);
      return freshLock ? { ...freshLock, broken: !!l.broken } : l;
    });

    // roles のオブジェクト参照を followers 内のインスタンスと同期
    ["sakura", "guard", "watcher"].forEach(k => {
      if (loaded.roles[k]) {
        const match = loaded.followers.find(f => f.id === loaded.roles[k].id);
        loaded.roles[k] = match || null;
      }
    });

    state = loaded;

    // UIテキストの復元
    if (state.uiSnapshot) {
      document.getElementById("news-text").textContent = state.uiSnapshot.news || rand(NEWS_LIST);
      document.getElementById("speaker-name").textContent = state.uiSnapshot.speaker || `相談者（${state.target.job}）`;
      document.getElementById("dialogue-text").textContent = state.uiSnapshot.dialogue || state.target.worry;
      document.getElementById("system-log").textContent = state.uiSnapshot.log || "";
    }

    updateUI();

    // 状態に応じた操作パネル・モーダルの復元
    if (state.pendingEventIdx !== null && RANDOM_EVENTS[state.pendingEventIdx]) {
      renderEventModal(state.pendingEventIdx);
    } else if (state.waitingNext) {
      showNextButton(state.nextButtonLabel || "次の日へ進む", false);
    } else {
      renderCommands(true);
    }

    return true;
  } catch (e) {
    console.warn("Load failed:", e);
    return false;
  }
}

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function weightedPick(pool, preferredIds) {
  const weighted = [];
  pool.forEach(item => {
    const weight = preferredIds.includes(item.id) ? 4 : 1;
    for (let i = 0; i < weight; i++) weighted.push(item);
  });
  return rand(weighted);
}

function initGame(isFirstBoot = false) {
  if (isFirstBoot && loadGame()) {
    return;
  }

  clearSaveData();
  state = {
    day: 1,
    police: 0,
    followers: [],
    roles: { sakura: null, guard: null, watcher: null },
    unlockedForbidden: [],
    sacrificeCount: 0,
    target: null,
    waitingNext: false,
    nextButtonLabel: "",
    forbiddenUsedThisTurn: false,
    observedThisTurn: false,
    pendingEventIdx: null,
    currentCommands: [],
    uiSnapshot: { news: "", speaker: "", dialogue: "", log: "" }
  };
  nextVisitor();

  if (isFirstBoot) {
    openModal("guide");
  }
}

function nextVisitor() {
  state.waitingNext = false;
  state.nextButtonLabel = "";
  state.forbiddenUsedThisTurn = false;
  state.observedThisTurn = false;
  state.pendingEventIdx = null;
  state.currentCommands = [];

  const jobObj = rand(JOBS);
  const worryObj = rand(WORRIES);

  const prefWeakIds = [...jobObj.prefWeak, ...worryObj.hintWeak];
  const weakness = weightedPick(WEAKNESSES_DATA, prefWeakIds);

  const prefLockIds = [...jobObj.prefLocks, ...worryObj.hintLocks];
  const lockCount = state.followers.length >= 6 ? 3 : 2;
  const selectedLocks = [];
  while (selectedLocks.length < lockCount) {
    const candidate = weightedPick(LOCKS_DATA, prefLockIds);
    if (!selectedLocks.some(l => l.id === candidate.id)) {
      selectedLocks.push({ ...candidate, broken: false });
    }
  }

  let initCaution = Math.floor(Math.random() * 46) + 50; // 50..95
  let initFanatic = 0;
  let revealed = false;
  let bonusLogs = [];

  if (state.roles.sakura) {
    const isActor = state.roles.sakura.tag === "actor";
    const cDrop = isActor ? 22 : 12;
    const fUp = isActor ? 20 : 12;
    initCaution = Math.max(25, initCaution - cDrop);
    initFanatic += fUp;
    bonusLogs.push(isActor
      ? `【サクラ（${state.roles.sakura.job}）】の迫真の演技で、相手の警戒心が大きく緩んでいる（-${cDrop}%）`
      : `【サクラ】の吹き込みにより、相手の警戒心が少し和らいでいる（-${cDrop}%）`);
  }
  if (state.roles.watcher) {
    revealed = true;
    const isMed = state.roles.watcher.tag === "medical";
    if (isMed) {
      initFanatic += 10;
      bonusLogs.push(`【監視役（${state.roles.watcher.job}）】のプロファイリングで弱点が最初から判明！`);
    } else {
      bonusLogs.push(`【監視役】の報告により、相手の隠された弱点が最初から判明している`);
    }
  }

  const maxTurns = lockCount === 3 ? 7 : 6;

  state.target = {
    job: jobObj.name,
    tag: jobObj.tag,
    worry: worryObj.text,
    weakness,
    locks: selectedLocks,
    caution: initCaution,
    fanatic: initFanatic,
    weaknessRevealed: revealed,
    turnsLeft: maxTurns
  };

  document.getElementById("news-text").textContent = rand(NEWS_LIST);
  document.getElementById("speaker-name").textContent = `相談者（${jobObj.name}）`;
  document.getElementById("dialogue-text").textContent = worryObj.text;

  let introHint = initCaution >= 75
    ? `⚠️ 相手は強く身構えている（初期警戒心 ${initCaution}%）。まずは【全肯定】などで警戒心を50%未満に下げよう。`
    : `相手の初期警戒心は ${initCaution}%。職業とセリフから弱点を推理し、警戒心を下げてから【沈黙】で観察しよう。`;

  document.getElementById("system-log").textContent = bonusLogs.length > 0 ? bonusLogs.join(" / ") : introHint;
  
  renderCommands(false);
  updateUI();
  saveGame();
}

function renderCommands(reuseSaved = false) {
  const grid = document.getElementById("command-grid");
  grid.innerHTML = "";
  const t = state.target;
  const stageIdx = t.fanatic < 35 ? 0 : (t.fanatic < 70 ? 1 : 2);

  let hand = [];

  if (reuseSaved && Array.isArray(state.currentCommands) && state.currentCommands.length > 0) {
    hand = state.currentCommands.map(item => {
      const cmdObj = COMMANDS_DATA.find(c => c.type === item.type);
      return { cmd: cmdObj, lineText: item.lineText };
    }).filter(x => x.cmd);
  }

  if (hand.length === 0) {
    // 1枚目: 必ず【全肯定】を入れて序盤の警戒心低下手段を保証
    const affirmCmd = COMMANDS_DATA.find(c => c.type === "affirm");

    // 2枚目: 未破壊ロックまたは弱点に有効なコマンドから1つ保証（手詰まり防止）
    const activeEffectiveTypes = new Set();
    t.locks.filter(l => !l.broken).forEach(l => l.effective.forEach(e => activeEffectiveTypes.add(e)));
    t.weakness.effective.forEach(e => activeEffectiveTypes.add(e));
    activeEffectiveTypes.delete("affirm");

    const effectivePool = COMMANDS_DATA.filter(c => activeEffectiveTypes.has(c.type));
    const guaranteedCmd = effectivePool.length > 0
      ? rand(effectivePool)
      : rand(COMMANDS_DATA.filter(c => c.type !== "affirm"));

    // 残り2枚: 重複しないようにランダム選出
    const usedTypes = new Set(["affirm", guaranteedCmd.type]);
    const remainingPool = COMMANDS_DATA.filter(c => !usedTypes.has(c.type)).sort(() => 0.5 - Math.random());
    const picks = [affirmCmd, guaranteedCmd, ...remainingPool.slice(0, 2)].sort(() => 0.5 - Math.random());

    hand = picks.map(cmd => {
      const phraseSet = rand(cmd.variations);
      return { cmd, lineText: phraseSet[stageIdx] };
    });

    state.currentCommands = hand.map(h => ({ type: h.cmd.type, lineText: h.lineText }));
  }

  hand.forEach(({ cmd, lineText }) => {
    const btn = document.createElement("button");
    btn.className = "cmd-card";
    btn.disabled = state.waitingNext;
    btn.innerHTML = `
      <div class="cmd-header-line">
        <span class="cmd-tag">${cmd.label}</span>
      </div>
      <div class="cmd-preview">${lineText}</div>
    `;
    btn.onclick = () => executeCommand(cmd, lineText);
    grid.appendChild(btn);
  });

  const obsBtn = document.getElementById("observe-btn");
  obsBtn.disabled = state.waitingNext || state.observedThisTurn;
  if (t.caution >= 50) {
    obsBtn.classList.add("risky");
    obsBtn.textContent = "👁️ 沈黙（観察）⚠️警戒高";
  } else {
    obsBtn.classList.remove("risky");
    obsBtn.textContent = "👁️ 沈黙（観察）";
  }

  document.getElementById("forbidden-btn").disabled = state.waitingNext || state.forbiddenUsedThisTurn || state.unlockedForbidden.length === 0;
}

// ==========================================
// 3. 心理戦アクション処理（沈黙・コマンド・地雷判定）
// ==========================================
function doObserve() {
  if (state.waitingNext || state.observedThisTurn) return;
  const t = state.target;
  state.observedThisTurn = true;
  t.turnsLeft--;

  if (t.caution >= 50) {
    const spike = Math.floor(Math.random() * 6) + 20; // +20〜25%
    t.caution = Math.min(100, t.caution + spike);

    document.getElementById("speaker-name").textContent = `相談者（不信感）`;
    document.getElementById("dialogue-text").textContent = "「……あの、なぜ何も仰らないんですか？ じっと見つめられて……気味が悪いです……」";
    document.getElementById("system-log").textContent = `⚠️ 警戒心が高いまま黙り込んだため不審がられた！（警戒心 +${spike}% / 弱点判明失敗）`;
  } else {
    t.weaknessRevealed = true;
    t.caution = Math.max(0, t.caution - 5);

    document.getElementById("speaker-name").textContent = "教祖（静かな観察）";
    document.getElementById("dialogue-text").textContent = "「……（心を開き始めた相手の微細な視線の動きと指先の震えを、あなたは見逃さなかった）」";
    document.getElementById("system-log").textContent = `👁️ 【観察成功】弱点【${t.weakness.name}】を見抜いた！ ${t.weakness.hint}`;
  }

  checkStateAfterAction();
}

function breakSpecificLocks(t, lockIds) {
  t.locks.forEach(l => {
    if (!l.broken && lockIds.includes(l.id)) {
      l.broken = true;
    }
  });
}

function executeCommand(cmd, lineText) {
  if (state.waitingNext) return;
  const t = state.target;
  state.observedThisTurn = false;
  state.currentCommands = []; // 次ターン用に手札をリセット
  t.turnsLeft--;

  const hitLockMine = t.locks.find(l => !l.broken && l.mine.includes(cmd.type));
  const hitWeakMine = t.weakness.mine.includes(cmd.type);
  const isHighCautionReject = (t.caution >= 65 && cmd.highCautionPenalty >= 18);

  document.getElementById("speaker-name").textContent = `教祖 → ${t.job}`;
  document.getElementById("dialogue-text").textContent = lineText;

  if (hitLockMine || hitWeakMine) {
    const penalty = hitLockMine ? 30 : 24;
    t.caution = Math.min(100, t.caution + penalty);
    const reactLine = hitLockMine ? hitLockMine.mineMsg : "「……何を言っているんですか？ 私の気持ちをまるで分かっていない！」";
    document.getElementById("system-log").textContent = `💥 【逆鱗に触れた！】${reactLine}（警戒心 +${penalty}% / 狂信度上昇なし）`;
    checkStateAfterAction();
    return;
  }

  if (isHighCautionReject) {
    const penalty = cmd.highCautionPenalty;
    t.caution = Math.min(100, t.caution + penalty);
    document.getElementById("system-log").textContent = `⚠️ 【警戒過多】まだ心を開いていない相手に踏み込みすぎた！「……急に何を言い出すんですか、怖いです……」（警戒心 +${penalty}%）`;
    checkStateAfterAction();
    return;
  }

  const isWeakHit = t.weakness.effective.includes(cmd.type);
  const targetableLocks = t.locks.filter(l => !l.broken && l.effective.includes(cmd.type));

  let mult = 1.0;
  if (isWeakHit) mult += 0.65;
  if (targetableLocks.length > 0) mult += 0.25;

  let cDelta = cmd.cautionDelta;
  if (isWeakHit) cDelta -= 10;
  if (cDelta > 0 && t.fanatic >= 50) cDelta = Math.floor(cDelta * 0.5);

  t.caution = Math.min(100, Math.max(0, t.caution + cDelta));
  const fanaticGain = Math.round(cmd.fanaticBase * mult);
  t.fanatic = Math.min(100, t.fanatic + fanaticGain);

  let brokenMsgs = [];
  if (targetableLocks.length > 0 && (t.fanatic >= 30 || isWeakHit)) {
    targetableLocks.forEach(lock => {
      lock.broken = true;
      t.caution = Math.max(0, t.caution - 10);
      brokenMsgs.push(`💥 常識【${lock.name}】が崩壊した！ ${lock.breakMsg}`);
    });
  }

  let logParts = [];
  const cStr = cDelta <= 0 ? `警戒心 ${cDelta}%` : `警戒心 +${cDelta}%`;
  logParts.push(`（${cStr} / 狂信度 +${fanaticGain}%）`);

  if (isWeakHit) {
    logParts.push(`★弱点【${t.weakness.name}】に深く刺さった！`);
  }
  if (brokenMsgs.length > 0) {
    logParts.push(brokenMsgs.join(" "));
  } else {
    const stillLocked = t.locks.find(l => !l.broken);
    if (stillLocked) {
      logParts.push(`相手の抵抗：${stillLocked.resist}`);
    }
  }
  document.getElementById("system-log").textContent = logParts.join(" ");

  checkStateAfterAction();
}

function useForbidden(fId) {
  const f = FORBIDDEN_DATA.find(x => x.id === fId);
  const t = state.target;
  if (!f || state.forbiddenUsedThisTurn || !f.canUse(t)) return;
  
  closeModal();
  state.forbiddenUsedThisTurn = true;
  const resultLog = f.effect(t);

  document.getElementById("speaker-name").textContent = `教祖【${f.name}】`;
  document.getElementById("dialogue-text").textContent = f.line;
  document.getElementById("system-log").textContent = `📖 ${resultLog}`;

  checkStateAfterAction();
}

function checkStateAfterAction() {
  updateUI();
  const t = state.target;
  const allBroken = t.locks.every(l => l.broken);

  if (t.caution >= 100) {
    handleReport();
  } else if (allBroken && t.fanatic >= 100) {
    handleConvert();
  } else if (t.turnsLeft <= 0) {
    handleTimeout();
  } else {
    renderCommands(true);
    saveGame();
  }
}

function handleTimeout() {
  state.waitingNext = true;
  renderCommands(true);
  const t = state.target;

  if (t.caution >= 75) {
    let increase = state.roles.guard ? (state.roles.guard.tag === "police" ? 8 : 15) : 25;
    state.police = Math.min(100, state.police + increase);
    document.getElementById("speaker-name").textContent = "相談者（立ち去り・通報）";
    document.getElementById("dialogue-text").textContent = "「……もう結構です。なんだか気味が悪い場所ですね……警察に相談します」";
    document.getElementById("system-log").textContent = `⌛ 時間切れ！警戒心が高いまま帰したため通報された（捜査レベル +${increase}%）。`;
    updateUI();
    if (state.police >= 100) {
      clearSaveData();
      setTimeout(() => showEnding("arrest"), 1300);
    } else {
      showNextButton("次の日へ進む", true);
    }
  } else {
    document.getElementById("speaker-name").textContent = "相談者（面談終了）";
    document.getElementById("dialogue-text").textContent = "「……今日は話を聞いていただきありがとうございました。そろそろ失礼します」";
    document.getElementById("system-log").textContent = `⌛ 時間切れ！陥落させきる前に相談者は帰ってしまった（通報はされなかった）。`;
    showNextButton("次の日へ進む", true);
  }
}

function handleReport() {
  state.waitingNext = true;
  renderCommands(true);
  let increase = state.roles.guard ? (state.roles.guard.tag === "police" ? 10 : 18) : 30;
  state.police = Math.min(100, state.police + increase);

  document.getElementById("speaker-name").textContent = "相談者（警戒心MAX・通報！）";
  document.getElementById("dialogue-text").textContent = rand(REPORT_LINES);
  document.getElementById("system-log").textContent = `⚠️ 警戒心が限界に達し通報された！警察の捜査レベルが +${increase}% 上昇（現在 ${state.police}%）。`;
  updateUI();

  if (state.police >= 100) {
    clearSaveData();
    setTimeout(() => showEnding("arrest"), 1300);
  } else {
    showNextButton("次の日へ進む", true);
  }
}

function handleConvert() {
  state.waitingNext = true;
  renderCommands(true);
  const t = state.target;
  const lastBroken = t.locks[t.locks.length - 1];

  const newFollower = {
    id: Date.now() + Math.random(),
    job: t.job,
    tag: t.tag,
    worry: t.worry,
    weakness: t.weakness.name,
    quote: lastBroken.breakMsg
  };
  state.followers.push(newFollower);

  let newlyUnlocked = checkUnlocks(newFollower);

  document.getElementById("speaker-name").textContent = `狂信者（元・${t.job}）`;
  document.getElementById("dialogue-text").textContent = `${lastBroken.breakMsg}「……教祖様、どうか私に聖なるお役目をお与えください！」`;
  
  let logMsg = `🩸 洗脳完了！【${t.job}】が狂信者として教団に加わった。`;
  if (newlyUnlocked.length > 0) {
    logMsg += ` ✨ 新たな禁断の教義【${newlyUnlocked.join("・")}】を習得！`;
  }
  document.getElementById("system-log").textContent = logMsg;
  updateUI();

  if (state.followers.length >= 25) {
    clearSaveData();
    setTimeout(() => showEnding("true_god"), 1400);
  } else {
    showNextButton("次の相談者を招き入れる", true);
  }
}

function checkUnlocks(f) {
  let unlockedNames = [];
  const addUnlock = (id) => {
    if (!state.unlockedForbidden.includes(id)) {
      state.unlockedForbidden.push(id);
      const item = FORBIDDEN_DATA.find(x => x.id === id);
      if (item) unlockedNames.push(item.name);
    }
  };

  if (f.tag === "medical") addUnlock("stigmata");
  if (f.tag === "rich") addUnlock("wealth");
  if (f.tag === "police") addUnlock("erasure");
  if (f.tag === "scholar") addUnlock("incense");
  if (state.followers.length >= 3) addUnlock("pseudofamily");
  if (state.followers.length >= 5) addUnlock("indulgence");
  if (state.followers.length >= 8) addUnlock("brand");
  if (state.roles.sakura && state.roles.guard && state.roles.watcher) addUnlock("hysteria");

  return unlockedNames;
}

function showNextButton(label, shouldSave = true) {
  state.nextButtonLabel = label;
  const grid = document.getElementById("command-grid");
  grid.innerHTML = `<button class="cmd-card" style="grid-column: 1 / -1; text-align:center; border-color: var(--gold); background:#1f1c29;" onclick="advanceDay()">
    <div class="cmd-tag" style="font-size:0.95rem;">▶ ${label}</div>
  </button>`;
  if (shouldSave) saveGame();
}

function advanceDay() {
  state.day++;
  if (state.roles.guard && state.police > 0) {
    const down = state.roles.guard.tag === "police" ? 10 : 5;
    state.police = Math.max(0, state.police - down);
  }

  if (state.day % 3 === 0 && state.followers.length > 0) {
    triggerRandomEvent();
  } else {
    nextVisitor();
  }
}

function triggerRandomEvent() {
  const evIdx = Math.floor(Math.random() * RANDOM_EVENTS.length);
  state.pendingEventIdx = evIdx;

  document.getElementById("speaker-name").textContent = `${state.day}日目・朝`;
  document.getElementById("dialogue-text").textContent = "「……夜明けとともに、聖堂の扉が激しく叩かれた――」";
  document.getElementById("system-log").textContent = "⚠️ 突発イベントが発生しました。対応を選択してください。";
  updateUI();
  saveGame();

  renderEventModal(evIdx);
}

function renderEventModal(evIdx) {
  const ev = RANDOM_EVENTS[evIdx];
  const overlay = document.getElementById("modal-overlay");
  const content = document.getElementById("modal-content");
  modalClosableByBackdrop = false;
  overlay.style.display = "flex";

  let html = `<div class="modal-title"><span>${ev.title}</span></div>
    <p style="line-height:1.6; font-size:0.95rem;">${ev.desc}</p>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">`;
  
  ev.choices.forEach((c, idx) => {
    html += `<button class="event-choice-btn" onclick="resolveEvent(${evIdx}, ${idx})">▶ ${c.text}</button>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function resolveEvent(evIdx, choiceIdx) {
  const ev = RANDOM_EVENTS[evIdx];
  const resText = ev.choices[choiceIdx].run();
  state.pendingEventIdx = null;
  modalClosableByBackdrop = true;
  closeModal();
  updateUI();

  if (state.police >= 100) {
    clearSaveData();
    showEnding("arrest");
  } else {
    nextVisitor();
    document.getElementById("system-log").textContent = `【昨夜の出来事】${resText}`;
    saveGame();
  }
}

function updateUI() {
  document.getElementById("day-num").textContent = state.day;
  document.getElementById("fanatic-count").textContent = state.followers.length;
  document.getElementById("police-text").textContent = `${state.police}%`;
  document.getElementById("police-fill").style.width = `${state.police}%`;
  document.getElementById("forbidden-count").textContent = state.unlockedForbidden.length;

  const pBox = document.getElementById("police-bar-box");
  const sacBtn = document.getElementById("sacrifice-btn");
  if (state.police >= 60) {
    pBox.classList.add("danger-pulse");
    sacBtn.classList.add("sacrifice-ready");
  } else {
    pBox.classList.remove("danger-pulse");
    sacBtn.classList.remove("sacrifice-ready");
  }

  const t = state.target;
  if (!t) return;
  document.getElementById("target-job").textContent = t.job;
  
  const turnBadge = document.getElementById("turn-badge");
  turnBadge.textContent = `残り ${Math.max(0, t.turnsLeft)} ターン`;
  if (t.turnsLeft <= 2) {
    turnBadge.classList.add("urgent");
  } else {
    turnBadge.classList.remove("urgent");
  }

  document.getElementById("caution-val").textContent = `${t.caution}%`;
  const cFill = document.getElementById("caution-fill");
  cFill.style.width = `${t.caution}%`;
  const cTag = document.getElementById("caution-state");

  if (t.caution >= 75) {
    cFill.style.background = "var(--crimson)";
    cTag.textContent = "厳戒";
    cTag.style.background = "rgba(176, 30, 56, 0.35)";
    cTag.style.color = "#ff8fa3";
  } else if (t.caution >= 50) {
    cFill.style.background = "var(--amber)";
    cTag.textContent = "警戒中";
    cTag.style.background = "rgba(217, 130, 43, 0.25)";
    cTag.style.color = "#f5b971";
  } else {
    cFill.style.background = "var(--ice)";
    cTag.textContent = "軟化";
    cTag.style.background = "rgba(139, 184, 196, 0.2)";
    cTag.style.color = "var(--ice)";
  }

  document.getElementById("fanatic-val").textContent = `${t.fanatic}%`;
  document.getElementById("fanatic-fill").style.width = `${t.fanatic}%`;
  document.getElementById("target-weakness").textContent = t.weaknessRevealed ? t.weakness.name : "？？？";

  const eyeL = document.getElementById("eye-l");
  const eyeR = document.getElementById("eye-r");
  eyeL.className = "eye";
  eyeR.className = "eye";
  if (t.fanatic >= 70) {
    eyeL.classList.add("fanatic-high");
    eyeR.classList.add("fanatic-high");
  } else if (t.fanatic >= 35) {
    eyeL.classList.add("fanatic-mid");
    eyeR.classList.add("fanatic-mid");
  } else if (t.caution >= 65) {
    eyeL.classList.add("caution-high");
    eyeR.classList.add("caution-high");
  }

  const locksDiv = document.getElementById("locks-container");
  locksDiv.innerHTML = "";
  t.locks.forEach(l => {
    const div = document.createElement("div");
    div.className = `lock-item ${l.broken ? "broken" : ""}`;
    div.textContent = l.broken ? `💥 ${l.name}（崩壊済）` : `🔒 ${l.name}`;
    locksDiv.appendChild(div);
  });

  let activeRoles = [];
  if (state.roles.sakura) activeRoles.push("サクラ");
  if (state.roles.guard) activeRoles.push("門番");
  if (state.roles.watcher) activeRoles.push("監視役");
  document.getElementById("role-bonus-info").textContent = `役職: ${activeRoles.length ? activeRoles.join("・") : "なし"}`;
}

// ==========================================
// 4. モーダル管理（役職・図鑑・禁断の教義・生贄・エンディング・取扱説明書）
// ==========================================
function openModal(type) {
  const overlay = document.getElementById("modal-overlay");
  const content = document.getElementById("modal-content");
  modalClosableByBackdrop = true;
  overlay.style.display = "flex";

  if (type === "guide") {
    content.innerHTML = `
      <div class="modal-title"><span>📖 心理戦の掟（取扱説明書）</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div style="font-size:0.84rem; line-height:1.6; color:#ddd; display:flex; flex-direction:column; gap:10px;">
        
        <div class="guide-section">
          <div class="guide-sec-title" style="color:var(--gold);">0. 教祖としての目的と敗北条件</div>
          <p><strong>【勝利条件】</strong> 迷える相談者の心を操り、<strong>すべての「常識ロック」を破壊した上で「狂信度」を100%</strong>にすると狂信者として入信します。<br>
          <strong>【敗北条件】</strong> 警戒心が <strong>100%</strong> に達するか、<strong>75%以上のままターン切れ</strong>になると通報され、上部の「捜査レベル」が上昇します。捜査が <strong>100%</strong> に達すると逮捕（ゲームオーバー）です。</p>
        </div>

        <div class="guide-section">
          <div class="guide-sec-title" style="color:var(--ice);">1. 面談の基本ステップ（まずはこれだけ覚えよう）</div>
          <p><strong>① 警戒心を50%未満に下げる：</strong> 相談者は最初 <strong>50〜95%</strong> の警戒心を抱いています。まずは【全肯定】などで心をほぐし、警戒心を <strong>50%未満（軟化状態）</strong> まで下げましょう。<br>
          <strong>② 【沈黙】で弱点を見抜く：</strong> 警戒心が <strong>50%未満</strong> になってから【沈黙（観察）】を使うと、相手の「隠された弱点」が判明します。（※50%以上の時に黙り込むと不審がられ、警戒心が激増するので注意！）<br>
          <strong>③ 弱点とロックを突いて狂信化：</strong> 判明した弱点や、相手の職業・最初の悩みから「常識ロック」に効きそうな言葉を選び、ターン内にすべてのロックを破壊して狂信度100%を目指します。</p>
        </div>

        <div class="guide-section">
          <div class="guide-sec-title" style="color:#ff8fa3;">2. 6種類の言葉（コマンド）の性質と地雷</div>
          <p><strong>・警戒心を下げやすい（序盤向き）：</strong><br>
           【全肯定】警戒心を大きく下げます。迷ったらまずこれを選びましょう。<br>
           【特別視】警戒心を少し下げつつ、選民意識をくすぐります。<br>
           【孤立化】周囲との繋がりを断たせます（高警戒時は少し反発されます）。<br>
          <strong>・狂信度を大きく上げるが警戒心も上がる（中盤〜終盤向き）：</strong><br>
           【共犯】【断罪】【恐怖】相手の心を強く揺さぶり狂信度を一気に高めますが、警戒心が高いうち（65%以上）に使うと強く拒絶されます。<br>
          <strong>・⚠️ 逆鱗（地雷）に注意：</strong> 相手の常識や弱点と正反対の言葉をぶつけると「逆鱗」に触れ、狂信度が上がらず警戒心が跳ね上がります。（例：家族想いの人に呪詛を吐く、プライドが高い人を見下す、など）</p>
        </div>

        <div class="guide-section">
          <div class="guide-sec-title" style="color:#e082ff;">3. 聖堂の裏機能（上部メニューの使い方）</div>
          <p><strong>・聖堂の役職：</strong> 狂信化した信者を「サクラ」「門番」「監視役」に任命できます。面談の有利化や捜査レベルの抑制など強力な効果があり、特定の職業を配置すると効果が倍増します。<br>
          <strong>・📖 禁断の教義：</strong> 特定の職業や人数の信者を獲得すると解放される切り札です。<strong>1回の面談につき1度だけ、ターンを消費せず</strong>にロックの強制破壊や警戒心の大幅低下を行えます。<br>
          <strong>・身代わり：</strong> 捜査レベルが危険域に達した際、狂信者1人にすべての罪を着せて自首させることで、捜査レベルを <strong>0%</strong> にリセットできます。<br>
          <strong>・オートセーブ：</strong> 進行状況は自動的にブラウザに保存され、再読み込みしても続きから再開できます。</p>
        </div>

      </div>
      <button class="primary-btn" onclick="closeModal()">理解した（聖堂へ戻る）</button>
    `;
  } else if (type === "roles") {
    let html = `<div class="modal-title"><span>聖堂の役職配置</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      <p style="font-size:0.83rem; color:#aaa;">狂信者を配置すると面談や防衛にパッシブ効果が得られます（特定の職業なら効果倍増）。</p>`;
    
    const roleDefs = [
      { key: "sakura", name: "礼拝堂のサクラ", desc: "初期警戒心-12%・狂信度+12%（俳優・インフルエンサー・元モデルは効果強化）" },
      { key: "guard", name: "聖堂の門番", desc: "通報時の捜査上昇緩和＆毎日-5%（元刑事・地方議員は効果強化）" },
      { key: "watcher", name: "告解室の監視役", desc: "面談開始時から弱点を開示（勤務医・看護師は初期狂信度+10%）" }
    ];

    roleDefs.forEach(r => {
      const assigned = state.roles[r.key];
      let optionsHtml = `<option value="">-- 未配置 --</option>`;
      state.followers.forEach(f => {
        const selected = assigned && assigned.id === f.id ? "selected" : "";
        optionsHtml += `<option value="${f.id}" ${selected}>${f.job}（弱点:${f.weakness}）</option>`;
      });

      html += `<div class="role-slot">
        <div class="role-slot-top">
          <div>
            <strong style="color:var(--gold);">${r.name}</strong><br>
            <span style="font-size:0.78rem; color:#999;">${r.desc}</span>
          </div>
        </div>
        <select class="role-select" onchange="setRole('${r.key}', this.value)">${optionsHtml}</select>
      </div>`;
    });
    content.innerHTML = html;

  } else if (type === "forbidden") {
    let html = `<div class="modal-title"><span>📖 禁断の教義（1面談1回）</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      <p style="font-size:0.82rem; color:#aaa;">特定の職業や人数を狂信化させることで解放される強力な切り札です（ターンを消費しません）。</p>`;
    
    FORBIDDEN_DATA.forEach(f => {
      const unlocked = state.unlockedForbidden.includes(f.id);
      if (unlocked) {
        const executable = f.canUse(state.target);
        html += `<div class="role-slot" style="border-color:#7c3896;">
          <div>
            <strong style="color:#e082ff;">${f.name}</strong><br>
            <span style="font-size:0.8rem; color:#ddd;">${f.desc}</span>
          </div>
          <button class="forbidden-btn" ${executable ? "" : "disabled"} onclick="useForbidden('${f.id}')">
            ${executable ? "この教義を唱える" : "条件未達（狂信度60%未満）"}
          </button>
        </div>`;
      } else {
        html += `<div class="role-slot" style="opacity:0.5;">
          <div>
            <strong style="color:#777;">🔒 未解放の教義</strong><br>
            <span style="font-size:0.78rem; color:#888;">解放条件: ${f.condText}</span>
          </div>
        </div>`;
      }
    });
    content.innerHTML = html;

  } else if (type === "archive") {
    let html = `<div class="modal-title"><span>狂信者名簿（${state.followers.length}人）</span><button class="close-btn" onclick="closeModal()">✕</button></div>`;
    if (state.followers.length === 0) {
      html += `<p style="color:#888; font-size:0.9rem;">まだ狂信化した信者はいません。</p>`;
    } else {
      state.followers.forEach(f => {
        html += `<div class="follower-list-item">
          <strong style="color:var(--gold);">${f.job}</strong>（弱点: ${f.weakness}）<br>
          <span style="color:#888; font-size:0.8rem;">入信前: ${f.worry}</span><br>
          <span style="color:#ff8fa3;">狂信後: ${f.quote}</span>
        </div>`;
      });
    }
    content.innerHTML = html;

  } else if (type === "sacrifice") {
    let html = `<div class="modal-title"><span style="color:#ff6b81;">身代わりの儀式（トカゲの尻尾切り）</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      <p style="font-size:0.85rem; line-height:1.5;">狂信者を1人選び、すべての詐欺の罪を着せて警察に自首させます。警察捜査レベルが <strong>0%</strong> にリセットされますが、その信者は永久に失われます。</p>`;
    
    if (state.followers.length === 0) {
      html += `<p style="color:#888; font-size:0.9rem;">生贄にできる狂信者がいません。</p>`;
    } else {
      state.followers.forEach((f, idx) => {
        html += `<div class="role-slot">
          <div><strong>${f.job}</strong><br><span style="font-size:0.8rem; color:#aaa;">「教祖様のためなら、喜んで鉄格子の向こうへ参ります……」</span></div>
          <button class="nav-btn" style="border-color:var(--crimson); color:#ff6b81;" onclick="executeSacrifice(${idx})">罪を着せて自首させる</button>
        </div>`;
      });
    }
    content.innerHTML = html;

  } else if (type === "retire") {
    let html = `<div class="modal-title"><span>教団の決断（エンディング分岐・データ管理）</span><button class="close-btn" onclick="closeModal()">✕</button></div>
      <p style="font-size:0.85rem; line-height:1.5;">現在の教団の状況に応じて、詐欺師としての幕引きを選択できます。</p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="event-choice-btn" onclick="clearSaveData(); showEnding('escape')">▶ 資産を持って海外へ高飛びする（いつでも可能）<br><span style="font-size:0.78rem; color:#999;">信者たちを置き去りにし、完璧な詐欺師として姿を消す。</span></button>
        ${state.followers.length >= 10 ? `<button class="event-choice-btn" style="border-color:var(--gold);" onclick="clearSaveData(); showEnding('cult_city')">▶ 街全体を聖域として支配する（条件達成：狂信者10人以上）<br><span style="font-size:0.78rem; color:#c5a663;">警察も行政も信者で固め、この街の絶対的な神となる。</span></button>` : ""}
        ${state.sacrificeCount >= 3 ? `<button class="event-choice-btn" style="border-color:#ff6b81;" onclick="clearSaveData(); showEnding('puppet_throne')">▶ 悲劇の聖職者としてメディアに君臨する（条件達成：身代わり3回以上）<br><span style="font-size:0.78rem; color:#ff8fa3;">すべての罪を幹部に着せ、世間の同情と寄付金を集める。</span></button>` : ""}
      </div>
      <div style="border-top:1px solid #2b2b38; padding-top:10px; margin-top:4px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.78rem; color:#888;">※進行状況は自動保存されています</span>
        <button class="nav-btn" style="border-color:#555; color:#aaa;" onclick="confirmReset()">データを消去して最初から</button>
      </div>`;
    content.innerHTML = html;
  }
}

function confirmReset() {
  if (confirm("現在の進行データ（狂信者・日数・習得教義）をすべて消去し、1日目からやり直しますか？")) {
    closeModal();
    initGame(false);
  }
}

function setRole(roleKey, followerIdStr) {
  if (!followerIdStr) {
    state.roles[roleKey] = null;
  } else {
    const fId = parseFloat(followerIdStr);
    for (let k in state.roles) {
      if (state.roles[k] && state.roles[k].id === fId) state.roles[k] = null;
    }
    state.roles[roleKey] = state.followers.find(f => f.id === fId) || null;
  }
  if (state.roles.sakura && state.roles.guard && state.roles.watcher) {
    const unlocked = checkUnlocks({ tag: "all_roles" });
    if (unlocked.length > 0) {
      document.getElementById("system-log").textContent = `✨ 聖堂の3役職がすべて揃ったことで、新たな禁断の教義【${unlocked.join("・")}】を習得！`;
    }
  }
  updateUI();
  saveGame();
}

function executeSacrifice(idx) {
  const victim = state.followers.splice(idx, 1)[0];
  for (let k in state.roles) {
    if (state.roles[k] && state.roles[k].id === victim.id) state.roles[k] = null;
  }
  state.police = 0;
  state.sacrificeCount++;
  closeModal();
  document.getElementById("news-text").textContent = `【週刊誌】『「すべて私がやりました」――謎の聖堂幹部（${victim.job}）が突然の自首』`;
  document.getElementById("system-log").textContent = `🩸 ${victim.job}がすべての罪を被って自首した。警察の捜査レベルが 0% にリセットされた！`;
  updateUI();
  saveGame();
}

function showEnding(endType) {
  const overlay = document.getElementById("modal-overlay");
  const content = document.getElementById("modal-content");
  modalClosableByBackdrop = false;
  overlay.style.display = "flex";

  const endings = {
    arrest: {
      title: "END 1：『鉄格子の聖者』",
      color: "#ff6b81",
      text: "深夜、聖堂の重厚な扉が蹴破られ、あなたは詐欺の容疑で逮捕された。<br><br>しかし裁判の日、傍聴席を埋め尽くした元信者たちは、手錠をかけられたあなたを見て涙を流し祈りを捧げていた。「教祖様は私たちの罪を背負って十字架につかれたのだ」――あなたの嘘は、牢獄の中で本物の神話へと完成してしまった。"
    },
    escape: {
      title: "END 2：『夜の逃亡者（完璧な詐欺師）』",
      color: "#8bb8c4",
      text: "聖堂が警察に踏み込まれたとき、そこには抜け殻となった狂信者たちだけが残されていた。<br><br>あなたは南の島の高級ホテルでグラスを傾けながら、ニュースで報じられる「謎の教祖失踪事件」を冷ややかに眺めている。神など最初からどこにもいなかったのだ。"
    },
    cult_city: {
      title: "END 3：『街を飲み込む聖域（カルトの完成）』",
      color: "#c5a663",
      text: `あなたは${state.followers.length}人の人間から常識を奪い、完全なる狂信者へと作り変えた。<br><br>いつしかこの街の警察官も、議員も、医者も、あなたの聖堂の信者になっていた。もはや誰もあなたを裁くことはできない。地図から消えたこの街は、あなたの言葉ひとつで動く巨大な聖堂へと変貌した――。`
    },
    puppet_throne: {
      title: "END 4：『身代わりの玉座（影の支配者）』",
      color: "#e082ff",
      text: `あなたは${state.sacrificeCount}人の忠実な狂信者にすべての罪を着せ、生き延びた。<br><br>メディアは「極悪非道な幹部たちに利用されていた悲劇の聖職者」としてあなたを同情的に報じた。世間の同情と莫大な寄付金を集めたあなたは、今日も無垢な笑顔で次の迷える子羊を聖堂へと招き入れる。`
    },
    true_god: {
      title: "TRUE END：『ミイラ取りがミイラに（真の狂信者）』",
      color: "#ff2a55",
      text: "25人もの人間の魂を書き換え、奇跡を装い続けたある夜。鏡に映った自分の瞳を見た瞬間、あなたは震えながら膝をついた。<br><br>――自分がでっち上げたはずの「神」の声が、確かに頭の中で響いている。詐欺師は死に、本物の教祖が誕生した。"
    }
  };

  const ed = endings[endType] || endings.escape;
  content.innerHTML = `
    <div class="modal-title"><span style="color:${ed.color};">${ed.title}</span></div>
    <p style="line-height:1.85; font-size:0.95rem;">${ed.text}</p>
    <div style="font-size:0.82rem; color:#888; border-top:1px solid #333; padding-top:8px;">
      到達日数: ${state.day}日目 / 狂信者数: ${state.followers.length}人 / 身代わり回数: ${state.sacrificeCount}回 / 習得教義: ${state.unlockedForbidden.length}種
    </div>
    <button class="primary-btn" onclick="modalClosableByBackdrop = true; closeModal(); initGame(false);">新たな聖堂を開く（最初から）</button>
  `;
}

function closeModal() {
  document.getElementById("modal-overlay").style.display = "none";
}

// 背景タップでモーダルを閉じる（選択必須のイベント・エンディング時は無効）
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay" && modalClosableByBackdrop) {
    closeModal();
  }
});

// 起動処理（セーブデータがあれば復元、なければ新規開始＋説明書表示）
initGame(true);
</script>
</body>
</html>
